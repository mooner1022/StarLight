name: Android CI

on:
  push:
    branches: [ "nightly" ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ "nightly" ]
    paths-ignore:
      - "**.md"

jobs:
  build:
    name: Build StarLight apk
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Bump versionCode
      uses: chkfung/android-version-actions@v1.2.2
      with:
        gradlePath: app/build.gradle.kts
        versionCode: 1000${{github.run_number}}

    - name: Build debug
      run: ./gradlew assembleDebug

    - name: Extract artifact name
      run: |
        name="$(find app/build/outputs/apk/debug/ -type f -name 'StarLight-*')"
        echo "ARTIFACT_NAME=${name##*/}" >> $GITHUB_ENV

    - name: Upload the Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: |
          app/build/outputs/apk/debug/${{ env.ARTIFACT_NAME }}

  snapshot:
    name: Publish StarLight snapshot
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: snapshot-publish
      cancel-in-progress: false

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Bump versionCode
      uses: chkfung/android-version-actions@v1.2.2
      with:
        gradlePath: app/build.gradle.kts
        versionCode: 1000${{github.run_number}}

    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::KEYSTORE_BASE64 is not set; refusing to publish an unsigned snapshot"
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

    - name: Build release
      run: ./gradlew assembleRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Checkout version repository
      uses: actions/checkout@v4
      with:
        repository: mooner1022/starlight-version
        token: ${{ secrets.VERSION_REPO_TOKEN }}
        path: version-repo

    - name: Publish snapshot
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        apk="$(find app/build/outputs/apk/release/ -type f -name 'StarLight-*.apk')"
        name="${apk##*/}"
        version="${name#StarLight-}"
        version="${version%.apk}"
        code="1000${{ github.run_number }}"
        tag="snapshot-$code"

        prev="$(gh release list --limit 100 --json tagName --jq "[.[].tagName | select(startswith(\"snapshot-\") and . != \"$tag\")][0] // empty")"
        notes="$RUNNER_TEMP/changes.md"
        {
          echo "## $version ($code)"
          if [ -n "$prev" ] && git rev-parse -q --verify "refs/tags/$prev" > /dev/null; then
            git log --no-merges -n 50 --format='+ %s' "$prev..HEAD"
          else
            git log --no-merges -n 20 --format='+ %s' HEAD
          fi
        } > "$notes"

        if gh release view "$tag" > /dev/null 2>&1; then
          gh release upload "$tag" "$apk" --clobber
        else
          gh release create "$tag" "$apk" --target "$GITHUB_SHA" --prerelease --title "Snapshot $version ($code)" --notes-file "$notes"
        fi

        url="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name"
        python3 .github/scripts/update_snapshot.py version-repo "$version" "$code" "$url" "$notes"

        cd version-repo
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add -A
        git diff --cached --quiet || git commit -m "Update snapshot to $version ($code)"
        for attempt in 1 2 3; do
          git push && break
          [ "$attempt" = 3 ] && exit 1
          git pull --rebase
        done
        cd ..

        gh release list --limit 100 --json tagName --jq ".[].tagName | select(startswith(\"snapshot-\") and . != \"$tag\")" \
          | xargs -r -n1 gh release delete --cleanup-tag -y

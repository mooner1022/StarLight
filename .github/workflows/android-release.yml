name: Android CI Release
 
on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Version code; leave empty to use the one in gradle/libs.versions.toml'
        required: false
        default: ''
 
jobs:
  build:
    name: Build StarLight Release apk
    runs-on: ubuntu-latest
 
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # A release takes the next code after the last release (1.0.0 was 10, 1.0.1 is 11), which the version bump
    # commit puts in libs.versions.toml. Only snapshots use 1000 followed by the run number.
    - name: Resolve versionCode
      id: version
      env:
        INPUT_CODE: ${{ github.event.inputs.build_version }}
      run: |
        code="$INPUT_CODE"
        if [ -z "$code" ]; then
          code="$(sed -nE 's/^versionCode = "([0-9]+)"$/\1/p' gradle/libs.versions.toml)"
        fi
        if ! [[ "$code" =~ ^[0-9]+$ ]]; then
          echo "::error::versionCode '$code' is not a number"
          exit 1
        fi
        if [ "$code" -ge 1000 ]; then
          echo "::error::versionCode $code looks like a snapshot's; a release takes the next code after the last release"
          exit 1
        fi
        echo "Release versionCode: $code"
        echo "code=$code" >> "$GITHUB_OUTPUT"

    - name: Bump versionCode
      uses: chkfung/android-version-actions@v1.2.2
      with:
        gradlePath: app/build.gradle.kts
        versionCode: ${{ steps.version.outputs.code }}
 
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -z "$KEYSTORE_BASE64" ]; then
          echo "::error::KEYSTORE_BASE64 is not set; refusing to build an unsigned release"
          exit 1
        fi
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV

    # PluginCore's API as this release ships it, kept in api/releases: slplugin learns from it which version added each
    # member (docs/plugincore-compatibility.md). Forgetting it once would date everything added since to a later version.
    - name: Check PluginCore's release API dump
      run: |
        version="$(sed -nE 's/^versionName = "([^"]+)"$/\1/p' gradle/libs.versions.toml)"
        dump="PluginCore/api/releases/$version.api"
        if [ ! -f "$dump" ]; then
          echo "::error::$dump is missing. Copy PluginCore/api/PluginCore.api to it when releasing $version."
          exit 1
        fi
        if ! cmp -s "$dump" PluginCore/api/PluginCore.api; then
          echo "::error::$dump differs from PluginCore/api/PluginCore.api. Copy the current dump over it before releasing."
          exit 1
        fi
        ./gradlew :PluginCore:checkKotlinAbi

    - name: Run unit tests
      run: ./gradlew testFullDebugUnitTest :docs-processor:test

    - name: Build release
      run: ./gradlew assembleFullRelease bundlePlayRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
 
    # Only the APK at the top: the baseline profile .dm files below it carry the same StarLight-* name.
    - name: Extract artifact name
      run: |
        name="$(find app/build/outputs/apk/full/release/ -maxdepth 1 -type f -name 'StarLight-*.apk' | head -n 1)"
        if [ -z "$name" ]; then
          echo "::error::No release APK in app/build/outputs/apk/full/release/"
          exit 1
        fi
        echo "ARTIFACT_NAME=${name##*/}" >> $GITHUB_ENV
        echo "ARTIFACT_PATH=$name" >> $GITHUB_ENV

    # An update only installs over the published app when it is signed with the same certificate.
    - name: Check the APK's signing certificate
      env:
        EXPECTED_CERT_SHA256: 4b5b75088146ed3a5cfbcf17a26e3ece009d8ea5a8948002a1d65b47a8c295c8
      run: |
        tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
        echo "apksigner from $tools"
        # Shown in full, so a failed check says why.
        if ! certs="$("$tools/apksigner" verify --print-certs "$ARTIFACT_PATH" 2>&1)"; then
          echo "$certs"
          echo "::error::apksigner couldn't verify the release APK"
          exit 1
        fi
        echo "$certs"
        # Every signer's certificate, as "Signer #1 certificate SHA-256 digest: …" or, from build-tools 37,
        # "V2 Signer: certificate SHA-256 digest: …"; all must be the published one.
        actual="$(printf '%s\n' "$certs" \
          | sed -nE 's/^.*certificate SHA-256 digest: ([0-9a-fA-F]+).*$/\1/p' | tr 'A-F' 'a-f' | sort -u)"
        if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
          echo "::error::The release APK is signed with '${actual:-nothing}', not the published certificate"
          exit 1
        fi
        echo "Signed with the published certificate: $actual"

    - name: Upload the Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: |
          app/build/outputs/apk/full/release/${{ env.ARTIFACT_NAME }}
        if-no-files-found: error

    - name: Upload the Google Play bundle
      uses: actions/upload-artifact@v4
      with:
        name: StarLight-play-release
        path: |
          app/build/outputs/bundle/playRelease/*.aab
        if-no-files-found: error

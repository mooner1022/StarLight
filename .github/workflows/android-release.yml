name: Android CI Release
 
on:
  workflow_dispatch:
    inputs:
      build_version:
        description: 'Define version code'
        required: true
        default: '7'
 
jobs:
  build:
    name: Build StarLight Release apk
    runs-on: ubuntu-latest
 
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Bump versionCode
      uses: chkfung/android-version-actions@v1.2.2
      with:
        gradlePath: app/build.gradle.kts
        versionCode: ${{github.event.inputs.build_version}}
 
    - name: Decode keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
        fi

    - name: Build release
      run: ./gradlew assembleFullRelease bundlePlayRelease
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
 
    # Only the APK at the top: the baseline profile .dm files below it carry the same StarLight-* name.
    - name: Extract artifact name
      run: |
        name="$(find app/build/outputs/apk/full/release/ -maxdepth 1 -type f -name 'StarLight-*.apk' | head -n 1)"
        if [ -z "$name" ]; then
          echo "::error::No release APK in app/build/outputs/apk/full/release/"
          exit 1
        fi
        echo "ARTIFACT_NAME=${name##*/}" >> $GITHUB_ENV

    - name: Upload the Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: |
          app/build/outputs/apk/full/release/${{ env.ARTIFACT_NAME }}
        if-no-files-found: error

    - name: Upload the Google Play bundle
      uses: actions/upload-artifact@v4
      with:
        name: StarLight-play-release
        path: |
          app/build/outputs/bundle/playRelease/*.aab
        if-no-files-found: error

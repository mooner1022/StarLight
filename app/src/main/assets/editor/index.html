<!DOCTYPE html>
<html lang="ko">
<head>
    <title>StarLight Embedded Editor</title>
    <link rel="stylesheet" type="text/css" href="./index.css">
    <style>
        @font-face {
            font-family: "JetBrains Mono";
            src: url("./JetBrainsMono-Regular.ttf");
        }

        #editor {
            font-family: "JetBrains Mono", monospace;
        }
    </style>
    <script src="./ace.min.js"></script>
    <script src="keybindings/keybinding-vscode.js"></script>
    <script src="extensions/ext-error_marker.js"></script>
    <script src="extensions/ext-beautify.js"></script>
    <script src="extensions/ext-language_tools.js"></script>
    <script src="extensions/ext-prompt.js"></script>
    <script src="extensions/ext-searchbox.js"></script>
</head>
<body>
<div id="placeholder">
    <h1 align="center">
        <img src="./assets/images/logo_transparent.svg" alt=""/><br>
        에디터 로드중...
    </h1>
</div>
<div id="editor"></div>
<script>
    const sessions = new Map();

    ace.config.set("basePath", "./");
    ace.config.set("themePath", "./themes/");
    ace.config.set("modePath", "./languages/");
    ace.config.set("workerPath", "./workers/");

    ace.require("ace/ext/prompt");
    ace.require("ace/ext/error_marker");
    ace.require("ace/ext/language_tools");
    ace.require("ace/ext/searchbox");
    ace.require("ace/keybinding/vscode");
    const beautify = ace.require("ace/ext/beautify");

    const editor = ace.edit("editor");

    editor.setOptions({
        enableBasicAutocompletion: true,
        enableSnippets: true,
        enableLiveAutocompletion: true,
        showPrintMargin: false,
        scrollPastEnd: 0.2,
        selectionStyle: "text",
        useSvgGutterIcons: true,
        animatedScroll: false,
        fontFamily: "JetBrains Mono",
        fontSize: "15px",
        mode: "ace/mode/javascript"
    });

    editor.renderer.setScrollMargin(0, 0, 0, 20)

    const reportedDirty = new Map();

    const reportDirty = (sessionId) => {
        const session = sessions.get(sessionId);
        if (!session) return;
        const dirty = !session.getUndoManager().isClean();
        if (reportedDirty.get(sessionId) === dirty) return;
        reportedDirty.set(sessionId, dirty);
        WebviewCallback.onDirtyChanged(sessionId, dirty);
    }

    const markClean = (session) => {
        const undoManager = session.getUndoManager();
        undoManager.lastDeltas = null;
        undoManager.markClean();
    }

    const setSession = (sessionId, mode, code) => {
        let session = sessions.get(sessionId);
        if (!session) {
            session = ace.createEditSession(code ?? "", `ace/mode/${mode}`);
            markClean(session);
            session.on("change", () => setTimeout(() => reportDirty(sessionId), 0));
            sessions.set(sessionId, session);
            reportedDirty.set(sessionId, false);
        }
        editor.setSession(session);
    }

    const closeSession = (sessionId) => {
        const session = sessions.get(sessionId);
        if (!session) return;
        sessions.delete(sessionId);
        reportedDirty.delete(sessionId);
        if (editor.session !== session)
            session.destroy();
    }

    const collectDirty = (sessionIds) => {
        const result = {};
        for (const [sessionId, session] of sessions) {
            if (sessionIds && !sessionIds.includes(sessionId)) continue;
            if (session.getUndoManager().isClean()) continue;
            result[sessionId] = session.getValue();
            markClean(session);
            reportedDirty.set(sessionId, false);
        }
        return result;
    }

    const markDirty = (sessionId) => {
        const session = sessions.get(sessionId);
        if (!session) return;
        session.getUndoManager().markClean(-1);
        reportDirty(sessionId);
    }

    const requestAnnotations = () =>
        WebviewCallback.onAnnotationUpdated(JSON.stringify(editor.getSession().getAnnotations()));

    const beautifyCode = () =>
        beautify.beautify(editor.getSession());

    const undo = () =>
        editor.undo();

    const redo = () =>
        editor.redo();

    const execCommand = (name) =>
        editor.execCommand(name);

    const moveCursor = (dx) =>
        dx < 0 ? editor.navigateLeft(-dx) : editor.navigateRight(dx);

    const setFontSize = (size) =>
        editor.setFontSize(size);

    const setWordWrap = (wrap) =>
        editor.setUseWrapMode(wrap);

    const setTheme = (name) =>
        editor.setTheme(`ace/theme/${name}`);

    const setLanguage = (name) =>
        editor.session.setMode(`ace/mode/${name}`);

    const setBottomInset = (px) => {
        editor.container.style.height = `calc(100% - ${px}px)`;
        editor.resize();
    }

    editor.container.addEventListener("scroll", () => {
        editor.container.scrollTop = 0;
        editor.container.scrollLeft = 0;
    });

    window.addEventListener("resize", () => {
        if (!editor.isFocused()) return;
        editor.resize(true);
        editor.renderer.scrollCursorIntoView(null, 0.5);
    });

    editor.renderer.on("themeLoaded", () =>
        document.body.style.background = getComputedStyle(editor.container).backgroundColor);

    const insertText = (text) => {
        editor.insert(text);
        editor.focus();
    }

    const _gotoLine = (row, col) => {
        editor.gotoLine(row, col, true);
    }

    const markError = (row, column, text) => {
        const session = editor.getSession();
        session.setAnnotations([{ row, column, text, type: "error" }]);
        editor.gotoLine(row + 1, column, true);
    }

    const apis = new Map();
    const setApis = (list) => {
        apis.clear();
        for (const api of list)
            apis.set(api.name, api);
    }

    const snippetManager = ace.require("ace/snippets").snippetManager;
    const setSnippets = (scope, list) =>
        snippetManager.register(list, scope);

    editor.completers.push({
        triggerCharacters: ["."],
        getCompletions: (editor, session, pos, prefix, callback) => {
            const before = session.getLine(pos.row).slice(0, pos.column - prefix.length);
            const owner = /([A-Za-z_$][\w$]*)\.$/.exec(before);
            if (owner) {
                const api = apis.get(owner[1]);
                callback(null, api ? api.members.map((member) => ({
                    caption: member.caption,
                    value: member.name,
                    meta: member.returns,
                    score: 1000,
                })) : []);
                return;
            }
            if (before.endsWith(".")) {
                callback(null, []);
                return;
            }
            callback(null, [...apis.keys()].map((name) => ({
                caption: name,
                value: name,
                meta: "api",
                score: 900,
            })));
        }
    });

    WebviewCallback.onLoadComplete();
    const placeHolder = document.getElementById("placeholder");
    if (placeHolder.style.display !== "none") {
        placeHolder.style.display = "none"
    }
</script>
</body>
</html>
